<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 8px;
      color: #222;
      background: #fff;
    }

    /* ── Sections ── */
    .section {
      border: 1px solid #e0e0e0;
      border-radius: 5px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .section-head {
      background: #f5f5f5;
      padding: 5px 8px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #555;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-head::before { content: '▾'; font-size: 10px; }
    .section-head.collapsed::before { content: '▸'; }
    .section-head:hover { background: #ececec; }
    .section-body { padding: 8px; }

    /* ── Form controls ── */
    input[type="text"], input[type="number"], select, textarea {
      font-family: inherit;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 3px 5px;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus { outline: none; border-color: #4a90e2; }

    input[type="number"] {
      width: 42px;
      text-align: center;
      font-family: 'Courier New', monospace;
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
    }

    pre {
      width: 100%;
      height: 120px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre;
      overflow: auto;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 3px;
      padding: 6px;
      margin: 0;
    }

    select { padding: 3px 4px; }

    /* ── Buttons ── */
    .btn {
      padding: 4px 10px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-blue   { background: #4a90e2; color: #fff; }
    .btn-blue:hover:not(:disabled)   { background: #357abd; }
    .btn-green  { background: #5a9e6a; color: #fff; }
    .btn-green:hover:not(:disabled)  { background: #4a8e5a; }
    .btn-sm {
      width: 22px; height: 22px;
      padding: 0; font-size: 14px; line-height: 1;
      border: 1px solid #ccc; background: #f8f8f8;
      border-radius: 3px; cursor: pointer;
    }
    .btn-sm:hover { background: #e8e8e8; }

    /* ── Row / label helpers ── */
    .row   { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
    .row:last-child { margin-bottom: 0; }
    .lbl   { color: #555; white-space: nowrap; }
    .cb-lbl { display: flex; align-items: center; gap: 3px; cursor: pointer; white-space: nowrap; }
    .val   { font-family: 'Courier New', monospace; min-width: 28px; text-align: center;
             border: 1px solid #ccc; border-radius: 3px; padding: 2px 3px; background: #fff; }

    /* ── Status ── */
    .status { font-size: 11px; color: #777; font-style: italic; margin-top: 4px; min-height: 14px; }
    .status.err { color: #c00; font-style: normal; font-weight: 500; }

    /* ── Song list ── */
    .song-item {
      padding: 4px 7px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }
    .song-item:last-child { border-bottom: none; }
    .song-item:hover { background: #eef4ff; }

    /* ── Create Slides button ── */
    #createBtn { width: 100%; padding: 8px; font-size: 13px; font-weight: 600; margin-top: 2px; }
    #createStatus { margin-top: 5px; }
  </style>
</head>
<body>

<!-- ── Song Lookup ───────────────────────────────────── -->
<div class="section">
  <div class="section-head collapsed" onclick="toggleSongSection(this)">🎵 Song Lookup</div>
  <div class="section-body" style="display:none">
    <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px">
      <select id="songSource" onchange="onSongSourceChange()" style="flex:1;min-width:0">
        <option value="all">All Sources</option>
        <option value="github:mattgraham/worship">GitHub: mattgraham/worship</option>
        <option value="drive">Google Drive: EasternGate/Songs</option>
        <option value="github:custom">GitHub: custom…</option>
        <option value="drive:custom">Google Drive: custom…</option>
      </select>
      <button id="deleteSourceBtn" onclick="deleteCurrentSource()"
        style="display:none;width:20px;height:20px;padding:0;background:#c33;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:15px;line-height:1;flex-shrink:0"
        title="Remove this source">×</button>
    </div>
    <div id="deleteConfirm" style="display:none;align-items:center;gap:5px;margin-bottom:4px;font-size:11px;color:#555">
      <span>Remove this source?</span>
      <button onclick="confirmDeleteSource()" style="padding:1px 7px;background:#c33;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px">Yes</button>
      <button onclick="cancelDeleteSource()" style="padding:1px 7px;background:#888;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px">No</button>
    </div>
    <input type="text" id="customSongRepo" placeholder="owner/repo or GitHub URL"
           style="width:100%;margin-bottom:4px;display:none"
           onchange="onCustomRepoEnter()">
    <input type="text" id="customDriveFolder" placeholder="Folder name or path, e.g. EasternGate/Songs"
           style="width:100%;margin-bottom:4px;display:none"
           onchange="onCustomDriveFolderEnter()">
    <div class="row">
      <span class="lbl">GitHub token:</span>
      <input type="password" id="githubToken" placeholder="optional — raises rate limit"
             style="flex:1;min-width:0" oninput="saveGithubToken()">
    </div>
    <input type="text" id="songSearch" placeholder="Search songs…" style="width:100%;margin-bottom:5px"
           oninput="filterSongs(this.value)">
    <div id="songList" style="max-height:160px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:3px;font-size:11px"></div>
    <div class="status" id="songStatus"></div>
  </div>
</div>

<!-- ── Scripture ─────────────────────────────────────── -->
<div class="section">
  <div class="section-head collapsed" onclick="toggle(this)">📖 Scripture Lookup</div>
  <div class="section-body" style="display:none">
    <div class="row">
      <input type="text" id="scriptureRef" placeholder="e.g. John 3:16-20" style="flex:1;min-width:0">
      <button class="btn btn-blue" id="lookupBtn" onclick="lookupScripture()">Look Up</button>
    </div>
    <div class="row">
      <span class="lbl">Translation:</span>
      <select id="translation" onchange="onTranslationChange()">
        <option value="esv">ESV</option>
        <option value="web">WEB (free)</option>
        <option value="kjv">KJV (free)</option>
      </select>
      <label class="cb-lbl"><input type="checkbox" id="verseNums" checked onchange="reloadFromCache()"> Verse #s</label>
      <label class="cb-lbl" title="Capitalizes he/him/his — works best in passages mainly about God/Jesus">
        <input type="checkbox" id="divinePronouns" checked onchange="reloadFromCache()"> He/Him
      </label>
    </div>
    <div class="row" id="esvKeyRow">
      <span class="lbl">ESV key:</span>
      <input type="text" id="esvKey" placeholder="api.esv.org" style="flex:1;min-width:0" oninput="saveKey()">
    </div>
    <div class="status" id="scriptureStatus"></div>
  </div>
</div>

<!-- ── Settings ──────────────────────────────────────── -->
<div class="section">
  <div class="section-head" onclick="toggle(this)">⚙️ Settings</div>
  <div class="section-body">
    <div class="row">
      <span class="lbl">Line width:</span>
      <button class="btn-sm" onclick="adjustLen(-1)">−</button>
      <input type="number" id="maxLen" value="30" min="10" max="120" oninput="outputIsScripture ? reloadFromCache() : updateOutput()">
      <button class="btn-sm" onclick="adjustLen(1)">+</button>
    </div>
    <div class="row">
      <span class="lbl">Lines/slide:</span>
      <button class="btn-sm" onclick="adjustLinesPerSlide(-1)">−</button>
      <input type="number" id="linesPerSlide" value="6" min="1" max="20">
      <button class="btn-sm" onclick="adjustLinesPerSlide(1)">+</button>
    </div>
    <div class="row">
      <span class="lbl">Transpose:</span>
      <button class="btn-sm" onclick="adjustTrans(-1)">−</button>
      <span class="val" id="transVal">0</span>
      <button class="btn-sm" onclick="adjustTrans(1)">+</button>
      <select id="accidentals" onchange="updateOutput()">
        <option value="sharp">Sharps (#)</option>
        <option value="flat">Flats (♭)</option>
      </select>
    </div>
    <div class="row">
      <span class="lbl">Chord format:</span>
      <select id="chordFormat" onchange="updateOutput()">
        <option value="above">Above lyrics</option>
        <option value="inline">Inline [chords]</option>
      </select>
    </div>
  </div>
</div>

<!-- ── Slide Tools ────────────────────────────────────── -->
<div class="section">
  <div class="section-head collapsed" onclick="toggle(this)">🛠 Slide Tools</div>
  <div class="section-body" style="display:none">
    <div class="row">
      <span class="lbl">Slides:</span>
      <input type="number" id="transFrom" min="1" style="width:46px" value="1">
      <span class="lbl">–</span>
      <input type="number" id="transTo" min="1" style="width:46px" value="">
    </div>
    <div class="row">
      <button class="btn btn-blue" onclick="transposeSelectedNotes()" title="Shift all chords in the speaker notes of the selected slides up or down by the Transpose amount">Transpose Existing Slides</button>
      <button class="btn btn-blue" onclick="normalizeSlides()" title="Copy the font, text color, and drop shadow from the first selected slide to all other text-box slides in the range. Also removes empty text boxes.">Normalize</button>
      <button class="btn btn-blue" id="convertWordArtBtn" onclick="convertWordArt()" style="display:none" title="Replace Word Art elements in the selected slides with text boxes, using the style of the first slide (or Comic Sans MS with a black drop shadow if the first slide has no text box).">Convert Word Art</button>
    </div>
    <div class="status" id="transposeStatus"></div>
  </div>
</div>

<!-- ── Input ─────────────────────────────────────────── -->
<div class="section">
  <div class="section-head" onclick="toggle(this)">✏️ Input</div>
  <div class="section-body">
    <textarea id="input" placeholder="Paste chord+lyrics here, or use Scripture Lookup above.

Am                G        Am
The gates and doors were barred
and all the windows fastened down" oninput="outputIsScripture=false;updateOutput()"></textarea>
  </div>
</div>

<!-- ── Output ────────────────────────────────────────── -->
<div class="section">
  <div class="section-head" onclick="toggle(this)">📄 Output</div>
  <div class="section-body">
    <pre id="output"></pre>
    <div class="row" style="margin-top:6px">
      <button class="btn btn-blue" onclick="copyOutput()">Copy</button>
      <span class="status" id="copyHint" style="font-style:normal"></span>
    </div>
  </div>
</div>

<!-- ── Create Slides ──────────────────────────────────── -->
<button class="btn btn-green" id="createBtn" onclick="createSlides()">▶ Create Slides</button>
<div class="status" id="createStatus"></div>

<script>
// ─── Note tables ──────────────────────────────────────────────────────────────
var SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

function noteIndex(n) {
  var i = SHARPS.indexOf(n);
  return i >= 0 ? i : FLATS.indexOf(n);
}
function transposeNote(note, steps, useFlats) {
  var idx = noteIndex(note);
  if (idx < 0) return note;
  return (useFlats ? FLATS : SHARPS)[((idx + steps) % 12 + 12) % 12];
}
function transposeChordToken(token, steps, useFlats) {
  if (steps === 0) return token;
  // Strip outer parens: (G) → G, (Am/D) → Am/D; re-add after transposing
  var outer = token.length > 2 && token[0] === '(' && token[token.length - 1] === ')';
  if (outer) token = token.slice(1, -1);
  var slash = token.indexOf('/', 1);
  var result;
  if (slash > 0) {
    result = transposeChordToken(token.slice(0, slash), steps, useFlats) +
             '/' + transposeChordToken(token.slice(slash + 1), steps, useFlats);
  } else {
    var hasAcc = token.length > 1 && (token[1] === '#' || token[1] === 'b');
    var root = hasAcc ? token.slice(0, 2) : token[0];
    result = transposeNote(root, steps, useFlats) + token.slice(root.length);
  }
  return outer ? '(' + result + ')' : result;
}
function transposeChordLine(line, steps, useFlats) {
  if (steps === 0) return line;
  return line.replace(/[^\s]+/g, function(t) { return transposeChordToken(t, steps, useFlats); });
}

// ─── Chord detection ──────────────────────────────────────────────────────────
// Matches a bare chord token (Am, G/D, Gsus4) or parenthesized token ((Am), (G/D))
var CHORD_PAT = /^[A-G][#b]?(m(?:aj)?|min|dim|aug|sus[24]?|add\d+)?\d*(?:\([^)]*\))?(?:\/[A-G][#b]?)?$/;
function isChordToken(w) {
  if (w.length > 2 && w[0] === '(' && w[w.length - 1] === ')') w = w.slice(1, -1);
  return CHORD_PAT.test(w);
}
function isChordLine(line) {
  var words = line.trim().split(/\s+/).filter(Boolean);
  return words.length > 0 && words.every(isChordToken);
}
function stripChordParens(line) {
  return line.replace(/\([A-G][^\s)]*\)/g, function(m) { return m.slice(1, -1); });
}

// ─── Split point ──────────────────────────────────────────────────────────────
var CONJ = new Set(['and','but','or','so','yet','for','nor','because','although',
                    'while','when','if','as','since','though','until','unless','where']);
var PREP = new Set(['in','on','at','to','from','with','by','of','about','through',
                    'into','over','under','before','after','between','among','upon','across','like']);

function findSplit(lyric, maxLen) {
  if (lyric.length <= maxLen) return -1;
  var min = Math.max(5, Math.floor(maxLen * 0.35));
  var minSecond = Math.max(6, Math.floor(maxLen * 0.35));
  var mid = Math.floor(lyric.length / 2);  // target: equal halves
  var best = -1, bestScore = -1e9;
  for (var i = min; i <= Math.min(maxLen, lyric.length - 1); i++) {
    if (lyric[i] !== ' ') continue;
    if (lyric.length - i - 1 < minSecond) continue;
    var quality;
    if (i > 0 && /[,;:]/.test(lyric[i - 1])) {
      quality = 3;
    } else {
      var word = (lyric.slice(i + 1).match(/^[a-zA-Z]+/) || [''])[0].toLowerCase();
      if (CONJ.has(word)) quality = 2;
      else if (PREP.has(word)) quality = 1;
      else quality = 0;
    }
    // Among same-quality candidates, prefer the split closest to the midpoint
    var score = quality * 1000 - Math.abs(i - mid);
    if (score > bestScore) { bestScore = score; best = i; }
  }
  if (best >= 0) return best;
  // Fallback: no split met minSecond — use space closest to midpoint regardless
  var fbBest = -1, fbDist = 1e9;
  for (var i2 = min; i2 <= Math.min(maxLen, lyric.length - 1); i2++) {
    if (lyric[i2] === ' ') { var d = Math.abs(i2 - mid); if (d < fbDist) { fbDist = d; fbBest = i2; } }
  }
  if (fbBest >= 0) return fbBest;
  for (var j = maxLen + 1; j < lyric.length; j++) if (lyric[j] === ' ') return j;
  return -1;
}

// ─── Wrap chord+lyric pair ────────────────────────────────────────────────────
function wrapPair(chord, lyric, maxLen) {
  var out = [];
  var ch = chord.padEnd(Math.max(chord.length, lyric.length));
  var ly = lyric;
  while (ly.length > maxLen) {
    var sp = findSplit(ly, maxLen);
    if (sp < 0) break;
    // Snap chord split backward to the nearest space so we never cut inside a chord token
    var chSp = sp;
    while (chSp > 0 && ch[chSp] !== ' ') chSp--;
    out.push([ch.slice(0, chSp).trimEnd(), ly.slice(0, sp).trimEnd()]);
    ch = ch.slice(chSp + 1);
    ly = ly.slice(sp + 1);
    if (ch.length < ly.length) ch = ch.padEnd(ly.length);
  }
  out.push([ch.trimEnd(), ly.trimEnd()]);
  return out;
}

// ─── Main process ─────────────────────────────────────────────────────────────
function process(input, maxLen, transposeSteps, useFlats) {
  var lines = input.split('\n');
  var out = [];
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (!line.trim()) { out.push(''); i++; continue; }
    if (isChordLine(line)) {
      var chordLine = stripChordParens(transposeChordLine(line, transposeSteps, useFlats));
      var nextLine = (i + 1 < lines.length) ? lines[i + 1] : '';
      if (nextLine && !isChordLine(nextLine) && nextLine.trim()) {
        wrapPair(chordLine, nextLine, maxLen).forEach(function(p, idx) {
          var pfx = idx > 0 ? '​' : '';
          if (p[0]) out.push(pfx + p[0]);
          out.push(pfx + p[1]);
        });
        i += 2;
      } else {
        out.push(chordLine); i++;
      }
    } else {
      wrapPair('', line, maxLen).forEach(function(p, idx) {
        var pfx = idx > 0 ? '​' : '';
        if (p[0]) out.push(pfx + p[0]);
        out.push(pfx + p[1]);
      });
      i++;
    }
  }
  return out.join('\n');
}

// ─── Scripture formatting ─────────────────────────────────────────────────────
function capitalizePronouns(text) {
  return text.replace(/\bhe\b/g,'He').replace(/\bhim\b/g,'Him')
             .replace(/\bhis\b/g,'His').replace(/\bhimself\b/g,'Himself');
}
function wrapTextLines(text, maxLen) {
  var lines = [];
  var rem = text.replace(/[\s\u00a0]+/g, ' ').trim();
  while (rem.length > maxLen) {
    var sp = -1;
    for (var i = Math.min(maxLen, rem.length - 1); i >= 1; i--) {
      if (rem[i] === ' ') { sp = i; break; }
    }
    if (sp < 0) {
      for (var j = maxLen + 1; j < rem.length; j++) { if (rem[j] === ' ') { sp = j; break; } }
    }
    if (sp < 0) break;
    lines.push(rem.slice(0, sp).trimEnd());
    rem = rem.slice(sp + 1);
  }
  if (rem) lines.push(rem.trimEnd());
  return lines;
}
function formatScripture(verses, canonical, maxLen, showNums, capitalize) {
  var lines = [];
  var useNums = showNums && verses.length > 1;
  verses.forEach(function(v) {
    var text = capitalize ? capitalizePronouns(v.text) : v.text;
    var prefix = useNums ? (v.verse + ': ') : '';
    wrapTextLines(prefix + text, maxLen).forEach(function(l) { lines.push(l); });
  });
  lines.push('-- ' + canonical);
  return lines.join('\n');
}

// ─── State ────────────────────────────────────────────────────────────────────
var transposeSteps  = 0;
var lastVerses      = null;
var lastCanonical   = '';
var outputIsScripture = false;

// Restore saved custom sources into the source dropdown.
(function loadSavedRepos() {
  var saved = JSON.parse(localStorage.getItem('savedSongRepos') || '[]');
  var select = document.getElementById('songSource');
  var anchor = select.querySelector('option[value="github:custom"]');
  saved.forEach(function(repo) {
    var val = 'github:' + repo;
    if (select.querySelector('option[value="' + CSS.escape(val) + '"]')) return;
    var opt = document.createElement('option');
    opt.value = val;
    opt.textContent = 'GitHub: ' + repo;
    select.insertBefore(opt, anchor);
  });
})();

(function loadSavedDriveFolders() {
  var saved = JSON.parse(localStorage.getItem('savedDriveFolders') || '[]');
  var select = document.getElementById('songSource');
  var anchor = select.querySelector('option[value="drive:custom"]');
  saved.forEach(function(folder) {
    var val = 'drive:' + folder;
    var found = false;
    for (var i = 0; i < select.options.length; i++) {
      if (select.options[i].value === val) { found = true; break; }
    }
    if (found) return;
    var opt = document.createElement('option');
    opt.value = val;
    opt.textContent = 'Google Drive: ' + folder;
    select.insertBefore(opt, anchor);
  });
})();

// Initialize slide range to cover all slides
google.script.run
  .withSuccessHandler(function(n) {
    document.getElementById('transTo').value = n;
  })
  .getSlideCount();

// Poll for slide selection every 2 seconds and update the range fields
var selectionPollBusy = false;
setInterval(function() {
  if (selectionPollBusy) return;
  selectionPollBusy = true;
  google.script.run
    .withSuccessHandler(function(range) {
      selectionPollBusy = false;
      if (!range) return;
      document.getElementById('transFrom').value = range.from;
      document.getElementById('transTo').value   = range.to;
      document.getElementById('convertWordArtBtn').style.display = range.hasWordArt ? '' : 'none';
    })
    .withFailureHandler(function() { selectionPollBusy = false; })
    .getSelectedSlideRange();
}, 2000);

function getMaxLen()   { return Math.max(10, parseInt(document.getElementById('maxLen').value) || 30); }
function getUseFlats() { return document.getElementById('accidentals').value === 'flat'; }

function updateOutput() {
  var input = document.getElementById('input').value;
  var fmt = document.getElementById('chordFormat').value;
  var text = (!outputIsScripture && fmt === 'above') ? parseOnSong(input) : input;
  document.getElementById('output').textContent = process(text, getMaxLen(), transposeSteps, getUseFlats());
}

function transposeSelectedNotes() {
  if (transposeSteps === 0) {
    document.getElementById('transposeStatus').textContent = 'Set a transpose amount first.';
    return;
  }
  var from = parseInt(document.getElementById('transFrom').value) || 1;
  var to   = parseInt(document.getElementById('transTo').value)   || null;
  var status = document.getElementById('transposeStatus');
  status.className = 'status';
  status.textContent = 'Transposing…';
  google.script.run
    .withSuccessHandler(function(n) {
      status.textContent = 'Transposed ' + n + ' slide(s).';
    })
    .withFailureHandler(function(e) {
      status.className = 'status err';
      status.textContent = e.message;
    })
    .transposeSelectedNotes(transposeSteps, getUseFlats(), from, to);
}

function convertWordArt() {
  var from   = parseInt(document.getElementById('transFrom').value) || 1;
  var to     = parseInt(document.getElementById('transTo').value)   || null;
  var status = document.getElementById('transposeStatus');
  status.className = 'status';
  status.textContent = 'Converting Word Art…';
  google.script.run
    .withSuccessHandler(function(n) {
      status.textContent = 'Converted ' + n + ' Word Art element(s).';
      document.getElementById('convertWordArtBtn').style.display = 'none';
    })
    .withFailureHandler(function(e) {
      status.className = 'status err';
      status.textContent = e.message;
    })
    .convertWordArt(from, to);
}

function normalizeSlides() {
  var from   = parseInt(document.getElementById('transFrom').value) || 1;
  var to     = parseInt(document.getElementById('transTo').value)   || null;
  var status = document.getElementById('transposeStatus');
  status.className = 'status';
  status.textContent = 'Normalizing…';
  google.script.run
    .withSuccessHandler(function(n) {
      status.textContent = 'Normalized ' + n + ' slide(s).';
    })
    .withFailureHandler(function(e) {
      status.className = 'status err';
      status.textContent = e.message;
    })
    .normalizeSlides(from, to);
}

function adjustLinesPerSlide(d) {
  var el = document.getElementById('linesPerSlide');
  el.value = Math.max(1, Math.min(20, (parseInt(el.value) || 6) + d));
}
function adjustLen(d) {
  var el = document.getElementById('maxLen');
  el.value = Math.max(10, Math.min(120, getMaxLen() + d));
  outputIsScripture ? reloadFromCache() : updateOutput();
}
function adjustTrans(d) {
  transposeSteps += d;
  var el = document.getElementById('transVal');
  el.textContent = transposeSteps >= 0 ? '+' + transposeSteps : transposeSteps;
  updateOutput();
}

// ─── GitHub token ─────────────────────────────────────────────────────────────
(function() {
  var t = localStorage.getItem('githubToken') || '';
  if (t) document.getElementById('githubToken').value = t;
})();
function saveGithubToken() {
  localStorage.setItem('githubToken', document.getElementById('githubToken').value.trim());
  songCatalog = null; // force re-fetch with new token
}
function getGithubToken() { return document.getElementById('githubToken').value.trim(); }

// ─── Scripture lookup ─────────────────────────────────────────────────────────
var savedKey = localStorage.getItem('esvApiKey') || '';
if (savedKey) document.getElementById('esvKey').value = savedKey;

function saveKey() {
  localStorage.setItem('esvApiKey', document.getElementById('esvKey').value.trim());
}
function onTranslationChange() {
  var isEsv = document.getElementById('translation').value === 'esv';
  document.getElementById('esvKeyRow').style.display = isEsv ? '' : 'none';
}

function setScriptureStatus(msg, isErr) {
  var el = document.getElementById('scriptureStatus');
  el.textContent = msg;
  el.className = 'status' + (isErr ? ' err' : '');
}
function reloadFromCache() {
  if (!lastVerses) return;
  document.getElementById('input').value = formatScripture(
    lastVerses, lastCanonical, getMaxLen(),
    document.getElementById('verseNums').checked,
    document.getElementById('divinePronouns').checked
  );
  updateOutput();
}

function lookupScripture() {
  var ref   = document.getElementById('scriptureRef').value.trim();
  var trans = document.getElementById('translation').value;
  var key   = document.getElementById('esvKey').value.trim();
  if (!ref) return;

  setScriptureStatus('Looking up…');
  document.getElementById('lookupBtn').disabled = true;

  google.script.run
    .withSuccessHandler(function(result) {
      lastVerses        = result.verses;
      outputIsScripture = true;
      lastCanonical = result.canonical;
      document.getElementById('input').value = formatScripture(
        result.verses, result.canonical, getMaxLen(),
        document.getElementById('verseNums').checked,
        document.getElementById('divinePronouns').checked
      );
      updateOutput();
      setScriptureStatus('Loaded ' + result.canonical);
      document.getElementById('lookupBtn').disabled = false;
    })
    .withFailureHandler(function(e) {
      setScriptureStatus(e.message, true);
      document.getElementById('lookupBtn').disabled = false;
    })
    .fetchScripture(ref, trans, key);
}

// ─── Song lookup ──────────────────────────────────────────────────────────────
var songCatalog = null; // [{name, url}]

function toggleSongSection(head) {
  toggle(head);
  if (songCatalog === null && head.nextElementSibling.style.display !== 'none') {
    loadSongCatalog();
  }
}

// Values that cannot be deleted by the user.
var NON_DELETABLE = {'all':1,'github:mattgraham/worship':1,'drive':1,'github:custom':1,'drive:custom':1};

function getSongSource() {
  var src = document.getElementById('songSource').value;
  if (src === 'github:custom') {
    var val = document.getElementById('customSongRepo').value.trim();
    return val ? 'github:' + val : null;
  }
  if (src === 'drive:custom') {
    var val = document.getElementById('customDriveFolder').value.trim();
    return val ? 'drive:' + val : null;
  }
  return src;
}

function onSongSourceChange() {
  var src = document.getElementById('songSource').value;
  document.getElementById('customSongRepo').style.display   = src === 'github:custom' ? '' : 'none';
  document.getElementById('customDriveFolder').style.display = src === 'drive:custom'  ? '' : 'none';
  document.getElementById('deleteSourceBtn').style.display   = NON_DELETABLE[src] ? 'none' : '';
  if (src !== 'github:custom' && src !== 'drive:custom') { songCatalog = null; loadSongCatalog(); }
}

function onCustomRepoEnter() {
  var el = document.getElementById('customSongRepo');
  var val = el.value.trim();
  if (!val) return;
  var m = val.match(/^(?:https?:\/\/)?github\.com\/(.+)/);
  if (m) { val = m[1].replace(/\/+$/, ''); el.value = val; }
  songCatalog = null;
  loadSongCatalog();
}

function onCustomDriveFolderEnter() {
  var val = document.getElementById('customDriveFolder').value.trim();
  if (!val) return;
  songCatalog = null;
  loadSongCatalog();
}

function deleteCurrentSource() {
  document.getElementById('deleteSourceBtn').style.display = 'none';
  document.getElementById('deleteConfirm').style.display = 'flex';
}

function confirmDeleteSource() {
  document.getElementById('deleteConfirm').style.display = 'none';
  var select = document.getElementById('songSource');
  var opt    = select.options[select.selectedIndex];
  var val    = opt.value;
  if (val.indexOf('github:') === 0) {
    var repo  = val.slice(7);
    var saved = JSON.parse(localStorage.getItem('savedSongRepos') || '[]');
    localStorage.setItem('savedSongRepos', JSON.stringify(saved.filter(function(r) { return r !== repo; })));
  } else if (val.indexOf('drive:') === 0) {
    var folder = val.slice(6);
    var saved  = JSON.parse(localStorage.getItem('savedDriveFolders') || '[]');
    localStorage.setItem('savedDriveFolders', JSON.stringify(saved.filter(function(f) { return f !== folder; })));
  }
  select.selectedIndex = 0;
  opt.remove();
  onSongSourceChange();
}

function cancelDeleteSource() {
  document.getElementById('deleteConfirm').style.display = 'none';
  document.getElementById('deleteSourceBtn').style.display = '';
}

function loadSongCatalog() {
  var source = getSongSource();
  if (!source) return;
  if (source === 'all') { loadAllSourcesCatalog(); return; }
  var selVal        = document.getElementById('songSource').value;
  var isCustomGH    = selVal === 'github:custom';
  var isCustomDrive = selVal === 'drive:custom';
  var isDrive       = source === 'drive' || source.indexOf('drive:') === 0;
  var folderPath    = source.indexOf('drive:') === 0 ? source.slice(6) : null;
  var repoPath      = !isDrive ? source.replace(/^github:/, '') : null;
  setSongStatus('Loading song list…');
  var runner = google.script.run
    .withSuccessHandler(function(songs) {
      songCatalog = songs;
      setSongStatus('');
      if (isCustomGH    && repoPath)    saveCustomRepo(repoPath);
      if (isCustomDrive && folderPath)  saveCustomDriveFolder(folderPath);
      filterSongs(document.getElementById('songSearch').value);
    })
    .withFailureHandler(function(e) { setSongStatus(e.message, true); });
  if (isDrive) {
    runner.getDriveSongsList(folderPath);
  } else {
    runner.fetchSongList(repoPath, getGithubToken());
  }
}

// Returns all source configs from the dropdown (excluding meta/template options).
function getAllSourceConfigs() {
  var select = document.getElementById('songSource');
  var configs = [];
  for (var i = 0; i < select.options.length; i++) {
    var opt = select.options[i];
    if (NON_DELETABLE[opt.value]) continue;
    configs.push({ value: opt.value, label: opt.text });
  }
  return configs;
}

function loadAllSourcesCatalog() {
  var configs = getAllSourceConfigs();
  if (!configs.length) { setSongStatus('No sources configured.'); songCatalog = []; return; }
  setSongStatus('Loading ' + configs.length + ' source(s)…');
  var allResults = [];
  var remaining = configs.length;

  function onDone() {
    remaining--;
    if (remaining > 0) {
      setSongStatus('Loading… (' + (configs.length - remaining) + '/' + configs.length + ')');
      return;
    }
    mergeAllSourceCatalogs(allResults);
  }

  configs.forEach(function(cfg) {
    var runner = google.script.run
      .withSuccessHandler(function(songs) {
        allResults.push({ songs: songs, label: cfg.label });
        onDone();
      })
      .withFailureHandler(function() { onDone(); });
    if (cfg.value === 'drive') {
      runner.getDriveSongsList(null);
    } else if (cfg.value.indexOf('drive:') === 0) {
      runner.getDriveSongsList(cfg.value.slice(6));
    } else {
      runner.fetchSongList(cfg.value.replace(/^github:/, ''), getGithubToken());
    }
  });
}

function mergeAllSourceCatalogs(allResults) {
  var map = {}; // normalizedKey -> {name, entries:[{label,url}]}
  allResults.forEach(function(result) {
    (result.songs || []).forEach(function(song) {
      var key = song.name.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!map[key]) map[key] = { name: song.name, entries: [] };
      map[key].entries.push({ label: result.label, url: song.url });
    });
  });
  var merged = [];
  Object.keys(map).forEach(function(k) {
    var item = map[k];
    merged.push({
      name:    item.name,
      url:     item.entries[0].url,
      sources: item.entries.length > 1 ? item.entries : null
    });
  });
  merged.sort(function(a, b) { return a.name.localeCompare(b.name); });
  songCatalog = merged;
  setSongStatus(merged.length + ' song(s) across ' + allResults.length + ' source(s).');
  filterSongs(document.getElementById('songSearch').value);
}

function saveCustomRepo(repo) {
  var saved = JSON.parse(localStorage.getItem('savedSongRepos') || '[]');
  if (saved.indexOf(repo) >= 0) return;
  saved.push(repo);
  localStorage.setItem('savedSongRepos', JSON.stringify(saved));
  var select = document.getElementById('songSource');
  var anchor = select.querySelector('option[value="github:custom"]');
  var opt = document.createElement('option');
  opt.value = 'github:' + repo;
  opt.textContent = 'GitHub: ' + repo;
  select.insertBefore(opt, anchor);
  select.value = 'github:' + repo;
  document.getElementById('customSongRepo').style.display = 'none';
  document.getElementById('deleteSourceBtn').style.display = '';
}

function saveCustomDriveFolder(folder) {
  var saved = JSON.parse(localStorage.getItem('savedDriveFolders') || '[]');
  if (saved.indexOf(folder) >= 0) return;
  saved.push(folder);
  localStorage.setItem('savedDriveFolders', JSON.stringify(saved));
  var select = document.getElementById('songSource');
  var anchor = select.querySelector('option[value="drive:custom"]');
  var opt = document.createElement('option');
  opt.value = 'drive:' + folder;
  opt.textContent = 'Google Drive: ' + folder;
  select.insertBefore(opt, anchor);
  select.value = 'drive:' + folder;
  document.getElementById('customDriveFolder').style.display = 'none';
  document.getElementById('deleteSourceBtn').style.display = '';
}

function setSongStatus(msg, isErr) {
  var el = document.getElementById('songStatus');
  el.textContent = msg;
  el.className = 'status' + (isErr ? ' err' : '');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function filterSongs(q) {
  var list = document.getElementById('songList');
  if (!songCatalog) { list.innerHTML = ''; return; }
  var lq = q.trim().toLowerCase();
  var matches = lq
    ? songCatalog.filter(function(s) { return s.name.toLowerCase().indexOf(lq) >= 0; })
    : songCatalog;
  list.innerHTML = '';
  matches.slice(0, 80).forEach(function(s) {
    var div = document.createElement('div');
    div.className = 'song-item';
    if (s.sources) {
      div.innerHTML = '<span>' + escHtml(s.name) + '</span>'
        + ' <span style="font-size:9px;color:#888;background:#f0f0f0;border-radius:2px;padding:1px 4px">'
        + s.sources.length + ' sources</span>';
      div.addEventListener('click', function(e) { toggleSourcePicker(div, s); });
    } else {
      div.textContent = s.name;
      div.dataset.url  = s.url;
      div.dataset.name = s.name;
      div.addEventListener('click', function() { loadSong(this.dataset.url, this.dataset.name); });
    }
    list.appendChild(div);
  });
}

function toggleSourcePicker(div, song) {
  var existing = div.querySelector('.source-picker');
  if (existing) { existing.remove(); return; }
  var picker = document.createElement('div');
  picker.className = 'source-picker';
  picker.style.cssText = 'margin-top:4px;border-top:1px solid #e8e8e8;padding-top:4px';
  song.sources.forEach(function(src) {
    var row = document.createElement('div');
    row.style.cssText = 'padding:3px 8px;cursor:pointer;font-size:11px;color:#333;border-radius:2px';
    row.textContent = '↳ ' + src.label;
    row.addEventListener('mouseover', function() { this.style.background = '#eef4ff'; });
    row.addEventListener('mouseout',  function() { this.style.background = ''; });
    row.addEventListener('click', function(e) {
      e.stopPropagation();
      loadSong(src.url, song.name);
    });
    picker.appendChild(row);
  });
  div.appendChild(picker);
}

function loadSong(url, name) {
  if (url.indexOf('drive://') === 0) {
    // Drive presentation: append its slides directly into the active presentation.
    setSongStatus('Inserting slides…');
    google.script.run
      .withSuccessHandler(function(n) {
        setSongStatus('Inserted ' + n + ' slide(s) from "' + name + '".');
      })
      .withFailureHandler(function(e) { setSongStatus(e.message, true); })
      .insertDriveSlides(url.slice('drive://'.length));
    return;
  }
  setSongStatus('Loading…');
  google.script.run
    .withSuccessHandler(function(raw) {
      outputIsScripture = false;
      lastVerses = null;
      document.getElementById('input').value = stripOnSongHeader(raw);
      updateOutput();
      setSongStatus('Loaded: ' + name);
    })
    .withFailureHandler(function(e) { setSongStatus(e.message, true); })
    .fetchSong(url);
}

// Strip everything before the first section header or inline chord line.
function stripOnSongHeader(raw) {
  var lines = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  var SECTION    = /^(\[)?(?:Verse|Chorus|Bridge|Pre-?Chorus|Intro|Outro|Tag|Interlude|Vamp)[\]:\s]|^\[(?:V|C|B)\d+\]\s*$/i;
  var HAS_INLINE = /\[[A-G]/;
  var CHORDPRO_SECT = /^\{(?:comment:|soc\b|sov\b|sob\b|start_of_)/i;
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (SECTION.test(t) || HAS_INLINE.test(t) || isChordLine(t) || CHORDPRO_SECT.test(t)) return lines.slice(i).join('\n').trim();
  }
  return raw.trim();
}

// Convert OnSong/ChordPro [Chord]lyric format → chord-line-above-lyric format
function parseOnSong(raw) {
  var lines = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  var out = [];
  var started = false;
  // Match section headers in both formats: [Verse 1] or Verse 1: or Chorus:
  var SECTION = /^(\[)?(?:Verse|Chorus|Bridge|Pre-?Chorus|Intro|Outro|Tag|Interlude|Vamp)[\]:\s]|^\[(?:V|C|B)\d+\]\s*$/i;
  // Metadata keys to always skip (even after started)
  var METADATA = /^(Title|Artist|Author|Key|Original Key|Tempo|Time|Capo|Duration|CCLI|Notes|Book|Scripture|Copyright|Themes?|Keywords?):/i;
  var HAS_INLINE = /\[[A-G]/; // has an inline chord marker

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var t = line.trim();

    // Always skip metadata lines regardless of position
    if (METADATA.test(t)) continue;

    // Handle ChordPro {directive} lines
    if (/^\{/.test(t)) {
      var cpLabel = null;
      var cpComment = t.match(/^\{comment:\s*([^}]+)/i);
      if (cpComment) {
        var cl = cpComment[1].trim();
        if (/^(Verse|Chorus|Bridge|Pre-?Chorus|Intro|Outro|Tag|Interlude|Vamp)\b/i.test(cl)) cpLabel = cl;
      } else if (/^\{s[o]c\b|^\{start_of_chorus\b/i.test(t)) { cpLabel = 'Chorus'; }
        else if (/^\{sov\b|^\{start_of_verse\b/i.test(t))    { cpLabel = 'Verse';  }
        else if (/^\{sob\b|^\{start_of_bridge\b/i.test(t))   { cpLabel = 'Bridge'; }
      if (cpLabel) {
        started = true;
        if (out.length && out[out.length - 1] !== '') out.push('');
        out.push('[' + cpLabel + ']');
      }
      continue; // skip all {directive} lines
    }

    if (!started) {
      if (SECTION.test(t) || HAS_INLINE.test(t) || isChordLine(t)) started = true;
      else continue;
    }

    if (!t) { out.push(''); continue; }

    if (SECTION.test(t)) {
      if (out.length && out[out.length - 1] !== '') out.push('');
      // Normalise to bracketed form for consistency
      var label = t.replace(/\[|\]|:$/g, '').trim();
      out.push('[' + label + ']');
      continue;
    }

    if (!HAS_INLINE.test(t)) {
      out.push(t); // plain lyric line or already-above chord line
      continue;
    }

    // Build chord line + lyric line from inline [Chord]lyric notation
    var chords = '';
    var lyrics = '';
    var pos = 0;
    var j = 0;
    while (j < line.length) {
      if (line[j] === '[') {
        var end = line.indexOf(']', j);
        if (end < 0) { lyrics += line[j]; pos++; j++; continue; }
        var chord = line.slice(j + 1, end);
        if (/^[A-G]/.test(chord)) {
          while (chords.length < pos) chords += ' ';
          if (chords.length > 0 && chords[chords.length - 1] !== ' ') chords += ' ';
          chords += chord;
        }
        j = end + 1;
      } else {
        lyrics += line[j];
        pos++;
        j++;
      }
    }
    if (chords.trim()) out.push(chords.trimEnd());
    if (lyrics.trim()) out.push(lyrics.trim());
  }

  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

// ─── Copy output ──────────────────────────────────────────────────────────────
function copyOutput() {
  var text = document.getElementById('output').textContent.replace(/​/g, '');
  var hint = document.getElementById('copyHint');
  function done() { hint.textContent = 'Copied!'; setTimeout(function() { hint.textContent = ''; }, 2000); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done);
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }
}

// ─── Create Slides ────────────────────────────────────────────────────────────
function createSlides() {
  var text = document.getElementById('output').textContent.trim();
  if (!text) { setCreateStatus('Nothing to create — output is empty.', true); return; }

  setCreateStatus('Creating slides…');
  document.getElementById('createBtn').disabled = true;

  google.script.run
    .withSuccessHandler(function(n) {
      setCreateStatus('Done — created ' + n + ' slide(s).');
      document.getElementById('createBtn').disabled = false;
    })
    .withFailureHandler(function(e) {
      setCreateStatus(e.message, true);
      document.getElementById('createBtn').disabled = false;
    })
    .createVerseSlides(text, outputIsScripture, Math.max(1, parseInt(document.getElementById('linesPerSlide').value) || 3), document.getElementById('chordFormat').value);
}
function setCreateStatus(msg, isErr) {
  var el = document.getElementById('createStatus');
  el.textContent = msg;
  el.className = 'status' + (isErr ? ' err' : '');
}

// ─── Collapsible sections ─────────────────────────────────────────────────────
function toggle(head) {
  var body = head.nextElementSibling;
  var collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  head.classList.toggle('collapsed', !collapsed);
}
